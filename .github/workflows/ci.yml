name: Clone Repository
on:
  push:
jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TERM: 25 # set environment variable TERM = dumb
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
      - name: Build
        run: ./gradlew check

